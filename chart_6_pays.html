Chart.defaults.font.family =
'-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif';
<h2 class="sr-only">Projection fiches et services par pays européen connu</h2>
<div style="display:flex;gap:12px;font-size:12px;color:var(--color-text-secondary);margin-bottom:8px">
  <span><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:#9FE1CB;margin-right:3px;vertical-align:middle"></span>Fiches projetées</span>
  <span><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:#185FA5;margin-right:3px;vertical-align:middle"></span>Services projetés (hors fiches)</span>
</div>
<div style="position:relative;width:100%;height:290px">
  <canvas id="c5" role="img" aria-label="Barres horizontales par pays. Allemagne en tête 281783 total, puis Royaume-Uni, France, Italie, Espagne, Pologne.">Projection fiches et services par pays.</canvas>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
var pays = [
  {p:'Pologne',     f:33942,  s:110895},
  {p:'Espagne',     f:42918,  s:140221},
  {p:'Italie',      f:58765,  s:198564},
  {p:'France',      f:66560,  s:224857},
  {p:'Royaume-Uni', f:69736,  s:235587},
  {p:'Allemagne',   f:83411,  s:281783}
];
new Chart(document.getElementById('c5'), {
  type: 'bar',
  data: {
    labels: pays.map(function(d){return d.p;}),
    datasets: [
      {label:'Fiches', data:pays.map(function(d){return d.f;}), backgroundColor:'#9FE1CB', borderRadius:3},
      {label:'Services (hors fiches)', data:pays.map(function(d){return d.s - d.f;}), backgroundColor:'#185FA5', borderRadius:3}
    ]
  },
  options: {
    indexAxis: 'y',
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: {display:false},
      tooltip: {
        callbacks: {
          title: function(i){return i[0].label;},
          label: function(ctx){
            var p = pays.find(function(d){return d.p===ctx.label;});
            return ctx.datasetIndex===0 ? 'Fiches: '+ctx.raw.toLocaleString('fr-FR') : 'Services total: '+p.s.toLocaleString('fr-FR');
          }
        }
      }
    },
    scales: {
      x: {stacked:true, ticks:{font:{size:11}, callback:function(v){return Math.round(v/1000)+'K';}}},
      y: {stacked:true, ticks:{font:{size:12}}, grid:{display:false}}
    }
  }
});
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>

Chart.defaults.font.family =
'-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif';</script>
