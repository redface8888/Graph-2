

<div style="display:flex;gap:12px;font-size:12px;color:var(--color-text-secondary);margin-bottom:8px">
  <span><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:#9FE1CB;margin-right:3px;vertical-align:middle"></span>Fiches projetées</span>
  <span><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:#185FA5;margin-right:3px;vertical-align:middle"></span>Services projetés (hors fiches)</span>
</div>

<div style="position:relative;width:100%;height:290px">
  <canvas id="c5"></canvas>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

<script>

// Police proche de Notion
Chart.defaults.font.family =
'-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif';

Chart.defaults.font.size = 11;

const pays = [
  {p:'Pologne',     f:33942,  s:110895},
  {p:'Espagne',     f:42918,  s:140221},
  {p:'Italie',      f:58765,  s:198564},
  {p:'France',      f:66560,  s:224857},
  {p:'Royaume-Uni', f:69736,  s:235587},
  {p:'Allemagne',   f:83411,  s:281783}
];

new Chart(document.getElementById('c5'), {
  type: 'bar',

  data: {
    labels: pays.map(d => d.p),

    datasets: [
      {
        label:'Fiches',
        data:pays.map(d => d.f),
        backgroundColor:'#9FE1CB',
        borderRadius:4
      },
      {
        label:'Services (hors fiches)',
        data:pays.map(d => d.s - d.f),
        backgroundColor:'#185FA5',
        borderRadius:4
      }
    ]
  },

  options: {
    indexAxis:'y',
    responsive:true,
    maintainAspectRatio:false,

    plugins:{
      legend:{display:false},
      title:{display:false},

      tooltip:{
        backgroundColor:'#191919',
        padding:10,
        callbacks:{
          title:(items)=>items[0].label,

          label:(ctx)=>{
            const p = pays.find(d => d.p === ctx.label);

            return ctx.datasetIndex === 0
              ? `Fiches : ${ctx.raw.toLocaleString('fr-FR')}`
              : `Services total : ${p.s.toLocaleString('fr-FR')}`;
          }
        }
      }
    },

    scales:{
      x:{
        stacked:true,

        grid:{
          color:'rgba(0,0,0,.06)'
        },

        ticks:{
          font:{
            size:11,
            weight:'500'
          },

          callback:(v)=>Math.round(v/1000)+'K'
        }
      },

      y:{
        stacked:true,

        grid:{
          display:false
        },

        ticks:{
          font:{
            size:11,
            weight:'500'
          }
        }
      }
    }
  }
});

</script>
