

<div style="position:relative;width:100%;height:400px">
  <canvas id="c" role="img" aria-label="Régions françaises par taux de complétion décroissant. Île-de-France 92,8% en haut, Corse 3,2% en bas. Barres uniformes à 100%, valeur réelle à l'intérieur.">Taux de complétion par région.</canvas>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
var reg = [
  {r:'Île-de-France',          pct:92.8},
  {r:'PACA',                   pct:76.7},
  {r:'Occitanie',              pct:65.8},
  {r:'Bretagne',               pct:57.6},
  {r:'Nouvelle-Aquitaine',     pct:54.6},
  {r:'Pays de la Loire',       pct:38.3},
  {r:'Hauts-de-France',        pct:37.7},
  {r:'Centre-Val de Loire',    pct:36.5},
  {r:'Grand Est',              pct:35.2},
  {r:'Normandie',              pct:32.0},
  {r:'Auvergne-Rhône-Alpes',   pct:30.0},
  {r:'Bourgogne-Franche-Comté',pct:23.3},
  {r:'Corse',                  pct:3.2}
];

new Chart(document.getElementById('c'), {
  type: 'bar',
  data: {
    labels: reg.map(function(d){ return d.r; }),
    datasets: [
      {
        label: 'Complété',
        data: reg.map(function(d){ return d.pct; }),
        backgroundColor: reg.map(function(d){
          return d.pct >= 70 ? '#1D9E75' : d.pct >= 40 ? '#EF9F27' : '#D3D1C7';
        }),
        borderRadius: 2,
        categoryPercentage: 0.7,
        barPercentage: 1.0
      },
      {
        label: 'Reste',
        data: reg.map(function(d){ return 100 - d.pct; }),
        backgroundColor: 'rgba(0,0,0,0.06)',
        borderRadius: 2,
        categoryPercentage: 0.7,
        barPercentage: 1.0
      }
    ]
  },
  options: {
    indexAxis: 'y',
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      tooltip: {
        callbacks: {
          label: function(ctx) {
            if (ctx.datasetIndex === 0) return ctx.raw.toFixed(1) + '%';
            return null;
          }
        },
        filter: function(item) { return item.datasetIndex === 0; }
      },
      datalabels: { display: false }
    },
    scales: {
      x: {
        stacked: true,
        min: 0,
        max: 100,
        ticks: { callback: function(v){ return v + '%'; }, font: { size: 10 } },
        grid: { color: 'rgba(128,128,128,.1)' }
      },
      y: {
        stacked: true,
        ticks: { font: { size: 11 } },
        grid: { display: false }
      }
    }
  },
  plugins: [{
    afterDraw: function(chart) {
      var ctx = chart.ctx;
      var meta = chart.getDatasetMeta(0);
      ctx.save();
      ctx.font = '500 11px system-ui, sans-serif';
      ctx.fillStyle = '#444441';
      ctx.textBaseline = 'middle';
      meta.data.forEach(function(bar, i) {
        var val = reg[i].pct.toFixed(1) + '%';
        var x = bar.x + 6;
        var y = bar.y;
        ctx.fillText(val, x, y);
      });
      ctx.restore();
    }
  }]
});
</script>
